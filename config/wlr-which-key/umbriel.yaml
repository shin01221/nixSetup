# Theming
font: JetBrainsMono Nerd Font 12
background: "#1f1f28e6"
color: "#dcd7ba"
border: "#c4b28a"
separator: " ➜ "
border_width: 1
corner_r: 3
corner_r_top_left: 0
corner_r_bottom_left: 0
padding: 15 # Defaults to corner_r
rows_per_column: 5 # No limit by default
column_padding: 25 # Defaults to padding
# Anchor and margin
anchor: bottom-left # One of center, left, right, top, bottom, bottom-left, top-left, etc.
# Only relevant when anchor is not center
margin_right: 0
margin_bottom: 0
margin_left: 0
margin_top: 0
# Keep Umbriel keybinds active while the menu is open.
# Set to `true` to let menu keys override compositor bindings.
inhibit_compositor_keyboard_shortcuts: false
# Try to guess the correct keyboard layout to use. Default is `false`.
auto_kbd_layout: true
menu:
  - key: "m"
    desc: Music&Volume
    submenu:
      - key: "."
        desc: NextSong
        cmd: playerctl --ignore-player=firefox --player=kopuz,tauon,spotify,mpd next
      - key: ","
        desc: PreviousSong
        cmd: playerctl --ignore-player=firefox --player=kopuz,tauon,spotify,mpd previous
      - key: "p"
        desc: Toggle on/off
        cmd: playerctl --ignore-player=firefox --player=kopuz,tauon,spotify,mpd play-pause
      - key: "m"
        desc: Mute
        cmd: noctalia msg volume-mute
      - key: "+"
        desc: VolumeUp
        cmd: noctalia msg volume-up 5
        keep_open: true
        repeat: true
      - key: "-"
        desc: VolumeDown
        cmd: noctalia msg volume-down 5
        keep_open: true
        repeat: true
      - key: "r"
        desc: RMPC
        cmd: music.sh rmpc
      - key: "l"
        desc: LRC
        cmd: music.sh lrc
      - key: "P"
        desc: MuteMicrophone
        cmd: noctalia msg mic-mute
  - key: "n"
    desc: noctalia-shell
    submenu:
      - key: "c"
        desc: ControlCenter
        cmd: noctalia msg panel-toggle control-center
      - key: "v"
        desc: Clipboard
        cmd: noctalia msg panel-toggle clipboard
      - key: "s"
        desc: Settings
        cmd: noctalia msg settings-toggle
      - key: "b"
        desc: ToggleBar
        cmd: noctalia msg bar-toggle
      - key: "w"
        desc: Wallpapers
        cmd: noctalia msg panel-toggle wallpaper
      - key: "r"
        desc: Record
        cmd: noctalia msg plugin noctalia/screen_recorder:service all toggle
      - key: "R"
        desc: Reload
        cmd: killall .noctalia-wrapp ; sleep 0.3 && noctalia &
      - key: "l"
        desc: "Toggle dark/light"
        cmd: noctalia msg theme-mode-toggle
  - key: "s"
    desc: Scripts
    submenu:
      - key: "m"
        desc: ToggleMPVAudio
        cmd: mpv-audio.sh
      - key: "w"
        desc: RandomWallpaper
        cmd: random_wall.sh
        keep_open: true
        repeat: true
      - key: "d"
        desc: DeleteCurrentWallpaper
        cmd: wallpaper-manager.sh --delete
        keep_open: true
        repeat: true
      - key: "t"
        desc: ToggleTransparency
        cmd: transparency-toggle.sh umbriel
  - key: "f"
    desc: Scratchpads
    submenu:
      - key: "m"
        desc: music
        cmd: umbriel msg scratchpad-toggle music
  - key: "a"
    desc: Applaications
    submenu:
      - key: "e"
        desc: File manager
        cmd: luciole
      - key: "b"
        desc: Browser
        cmd: zen-beta
      - key: "s"
        desc: Spotify
        cmd: spotify
      - key: "d"
        desc: Discord
        cmd: vesktop
      - key: "t"
        desc: Telegram
        cmd: Telegram
      - key: "o"
        desc: Obs
        cmd: obs
