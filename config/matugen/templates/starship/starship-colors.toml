# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"
# ############
#   Notes   #
# ############
# This config assumes you have a Nerd Font installed and enabled in your terminal.
# I use 'FiraCode Nerd Font Mono', but you should be able to use any Nerd Font you like.
# ###############
#   Settings   #
# ###############
# Inserts a blank line between shell prompts
add_newline = true
# Maximum time it may take to produce the prompt
command_timeout = 3000
# #######################
#   Webber's colours   #
# #######################
# Bright pink: (bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}})
# Middle pink, bright text: (bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}})
# Middle pink, faded text: (bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}})
# Dark pink, regular text: (bg:{{colors.secondary_container.default.hex}} fg:{{colors.on_secondary_container.default.hex}})
# Dark pink, highlighted: (bg:{{colors.secondary_container.default.hex}} fg:{{colors.primary.default.hex}})
# ##############
#   Prompts   #
# ##############
# Right prompt. This is displayed on the right side of the terminal.
# Colours (i.e. bg and fg) are always listed from left to right.
#
# Note: Not supported in Powershell
# @see: https://starship.rs/advanced-config/#enable-right-prompt
# Left prompt. This is displayed on the left side of the terminal.
# Colours (i.e. bg and fg) are always listed from left to right.
format = """
[](bg:#transparent fg:{{colors.primary.default.hex}})\
$os\
[](fg:{{colors.primary.default.hex}} bg:{{colors.primary_container.default.hex}})\
$directory\
${custom.pregit}\
$git_branch\
$git_state\
$git_status\
${custom.postgit}\
${custom.nogit}\
$package\
$python\
$lua\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$bun\
$nim\
$rust\
$scala\
$docker_context\
$character\
"""

# #######################
#   Special sections   #
# #######################

# Exit code indicator
[character]  # The name of the module we are configuring is 'character'
success_symbol = "[](bg:{{colors.primary_container.default.hex}} fg:{{colors.primary.default.hex}})[](bold bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}})[](fg:{{colors.primary.default.hex}} bg:transparent)"
error_symbol = "[](bg:{{colors.primary_container.default.hex}} fg:{{colors.error.default.hex}})[](bold bg:{{colors.error.default.hex}} fg:{{colors.on_error.default.hex}})[](fg:{{colors.error.default.hex}} bg:transparent)"
vimcmd_symbol = "[](bg:{{colors.primary_container.default.hex}} fg:{{colors.primary.default.hex}})[](bold bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}})[](fg:{{colors.primary.default.hex}} bg:transparent)"
format = "$symbol "

# cross-platform way to check if we are in a git repo, takes 200ms
[custom.nogit]
when = ''' git rev-parse --git-dir ; test $? = False '''
format = "[ ](bg:{{colors.primary_container.default.hex}})"
disabled = true

# Either `Administrator`, `root` or the current user's username.
[username]
show_always = true
style_user = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
style_root = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
format = "[ $user]($style)"
disabled = false

# Displays a symbol that represents the current operating system
[os]
style = "bg:{{colors.primary.default.hex}} fg:{{colors.on_primary.default.hex}}"
format = "[死Shin]($style)"
disabled = false  # This doesn't work in pwsh in Webstorm terminal.

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

# The current directory
[directory]
style = "bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = ""

[hostname]
ssh_symbol = ""

[memory_usage]
symbol = "󰍛"

[time]
disabled = false
time_format = "%R"  # Hour:Minute Format
style = "bg:{{colors.primary_container.default.hex}}"
format = "[$time]($style)"

# ######################
#   Version control   #
# ######################

[git_branch]
symbol = "[](bg:{{colors.inverse_primary.default.hex}})"
style = "bg:{{colors.inverse_primary.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
format = "[](fg:{{colors.primary_container.default.hex}} bg:{{colors.inverse_primary.default.hex}})[ $symbol](bg:{{colors.inverse_primary.default.hex}} fg:{{colors.primary.default.hex}})[ $branch ]($style)"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bg:{{colors.inverse_primary.default.hex}} fg:bold red)"
rebase = "[ REBASING](bg:{{colors.inverse_primary.default.hex}} fg:bold green)"
merge = "[ MERGING](bg:{{colors.inverse_primary.default.hex}} fg:bold yellow)"
bisect = "[🔍 BISECTING](bg:{{colors.inverse_primary.default.hex}} fg:bold blue)"
am = "[AM](bg:{{colors.inverse_primary.default.hex}} fg:bold green)"
am_or_rebase = "[AM/REBASE](bg:{{colors.inverse_primary.default.hex}} fg:bold green)"
revert = "[󰕍 REVERTING](bg:{{colors.inverse_primary.default.hex}} fg:bold red)"

[git_metrics]
added_style = "bg:{{colors.secondary_container.default.hex}} fg:{{colors.tertiary.default.hex}}"
deleted_style = "bg:{{colors.secondary_container.default.hex}} fg:{{colors.error.default.hex}}"
format = "([+$added ]($added_style))([-$deleted ]($deleted_style))"
disabled = false

[git_status]
style = "bg:{{colors.inverse_primary.default.hex}} fg:{{colors.primary.default.hex}}"
conflicted = "="  # This branch has merge conflicts.
ahead = ""
behind = ""
diverged = "󱡷"
up_to_date = ""
untracked = "?"
stashed = ""
modified = ""
staged = ""
renamed = "»"
deleted = "✘"
format = "([($all_status )($ahead_behind )]($style))[](bg:{{colors.inverse_primary.default.hex}} fg:{{colors.primary_container.default.hex}})"

[fossil_branch]
symbol = ""

[hg_branch]
symbol = ""

[pijul_channel]
symbol = ""

# ###########################
#   Contexts (canonical)   #
# ###########################

[nodejs]
symbol = ""
style = "bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
format = "[$symbol](bg:{{colors.primary_container.default.hex}} fg:{{colors.primary.default.hex}})[ ($version) ]($style)"

[bun]
symbol = "󰅟"
style = "bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
format = "[$symbol](bg:{{colors.primary_container.default.hex}} fg:{{colors.primary.default.hex}})[ ($version) ]($style)"

[docker_context]
symbol = ""
style = "bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
format = "[$symbol](bg:{{colors.primary_container.default.hex}} fg:{{colors.primary.default.hex}})[ (context) ]($style)"

[package]
format = "($style)[> $symbol$version ]($style)"
symbol = "📦 "
version_format = "v${raw}"
style = "bold 208 bg:{{colors.primary_container.default.hex}}"
display_private = false
disabled = true
