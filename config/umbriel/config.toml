# Umbriel configuration mirrored from ~/.config/niri/config.kdl
# Reference: https://docs.noctalia.dev/umbriel/
#
# Validate with: umbriel config validate

# ==============================================================================
# General
# Mirrors the niri startup commands and activation behaviour.
# ==============================================================================
[general]
autostart = [
  "noctalia",
  "dbus-update-activation-environment --all",
  "sleep 1 & dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP",
  "wayscriber --daemon",
]
show_cheatsheet = false
focus_on_activate = true

xwayland = true
xwayland_native_resolution = false
xwayland_xsettings = true
xwayland_primary_output = ""
nvidia_sync_workaround = false
attach_modal_dialogs = true
honor_restored_maximize = false

[environment]
NIXOS_OZONE_WL = "1"
QT_QPA_PLATFORM = "wayland"
SDL_VIDEODRIVER = "wayland"
XDG_MENU_PREFIX = "plasma-"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
GTK_USE_PORTAL = "1"
GTK_IM_MODULE = "simple"
XCURSOR_THEME = "Bibata-Modern-Classic"
XCURSOR_SIZE = "24"

# ==============================================================================
# Outputs
# Mirrors niri output "eDP-1" { variable-refresh-rate on-demand=true; }
# ==============================================================================
[output.eDP-1]
vrr = "fullscreen"

# ==============================================================================
# Input
# Mirrors niri input / cursor settings.
# ==============================================================================
[input.keyboard]
layout = "us,ara"
options = "caps:super"
repeat_rate = 50
repeat_delay = 300

[input.touchpad]
tap = true
sensitivity = 0.3
disable_on_external_mouse = true

[input.focus]
follows_mouse = "sloppy"
follows_mouse_max_scroll = 0.3

[input.cursor]
theme = "Bibata-Modern-Classic"
size = 24
hide_when_typing = true
hide_timeout_ms = 1000

[workspaces]
back_and_forth = true

# ==============================================================================
# Appearance
# Mirrors niri layout / decorations / blur / tab-indicator settings.
# ==============================================================================
[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 0

[appearance.shadow]
enabled = true
softness = 20
offset_x = 2
offset_y = 7

[appearance.tab_bar]
style = "indicator"
position = "right"
height = 4
gap = 4
tab_gap = 2
corner_radius = 8

# ==============================================================================
# Layout
# Mirrors niri gaps / preset widths / focus / scrolling behaviour.
# ==============================================================================
[layout]
mode = "scrolling"
gap = 2
extent_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
default_extent_fraction = 0.6
center_focused = "never"

[layout.tabs]
default_display = "normal"

# ==============================================================================
# Keybinds
# Mirrors niri keybinds. Defining [keybinds] replaces Umbriel's built-in set.
# niri's Mod+T niri-sidebar binding has no Umbriel equivalent and is omitted.
# ==============================================================================
[keybinds]

# Applications, screenshots and media
"Mod+Return" = { action = "spawn ghostty", repeat = false }
"Mod+Alt+D" = { action = "spawn qs -c noctalia-shell ipc call launcher windows", repeat = false }
"Mod+Shift+Return" = { action = "spawn env NO_TMUX=1 foot", repeat = false }
"Mod+D" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Alt+Print" = { action = "spawn noctalia msg screenshot-fullscreen all", repeat = false }
"Ctrl+Print" = { action = 'spawn mkdir -p /home/shin/Pictures/Screenshots && wayscrollshot -o /home/shin/Pictures/Screenshots/wayscrollshot-$(date +%Y-%m-%d_%H-%M-%S).png', repeat = false }
"Ctrl+Shift+Print" = { action = 'spawn mkdir -p /home/shin/Pictures/Screenshots && wayscrollshot -o /tmp/wss.png && swappy -f /tmp/wss.png -o /home/shin/Pictures/Screenshots/wayscrollshot-$(date +%Y-%m-%d_%H-%M-%S).png; rm -f /tmp/wss.png', repeat = false }
"Mod+F1" = { action = "spawn pkill -SIGUSR1 wayscriber", repeat = false }
"Mod+Equal" = { action = "spawn noctalia msg volume-up 5" }
"Mod+Minus" = { action = "spawn noctalia msg volume-down 5" }
"Mod+U" = { action = "workspace-set-layout toggle", repeat = false,allow_when_locked = true }
"Mod+Alt+Return" = { action = "spawn scratchpad.sh foot-dropterm", repeat = false }
"Mod+BracketRight" = { action = "spawn playerctl --ignore-player=firefox --player=kopuz,tauon,spotify,mpd position 10+" }
"Mod+BracketLeft" = { action = "spawn playerctl --ignore-player=firefox --player=kopuz,tauon,spotify,mpd position 10-" }

# Media, volume and brightness keys
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn playerctl play-pause", allow_when_locked = true }
"XF86AudioStop" = { action = "spawn playerctl stop", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn playerctl previous", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn playerctl next", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn brightnesscontrol.sh -i", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn brightnesscontrol.sh -d", allow_when_locked = true }

# Window management
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"

"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+L" = "column-move-right"

"Mod+J" = "window-focus-or-workspace-down"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+Ctrl+J" = "window-move-or-workspace-down"
"Mod+Ctrl+K" = "window-move-or-workspace-up"

"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"

"Mod+Shift+J" = "workspace-move-down"
"Mod+Shift+K" = "workspace-move-up"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"

"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }

"Mod+Alt+WheelDown" = "window-focus-right"
"Mod+Alt+WheelUp" = "window-focus-left"
"Mod+Ctrl+Alt+WheelDown" = "column-move-right"
"Mod+Ctrl+Alt+WheelUp" = "column-move-left"

"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

"Mod+Ctrl+1" = "column-move-to-workspace 1"
"Mod+Ctrl+2" = "column-move-to-workspace 2"
"Mod+Ctrl+3" = "column-move-to-workspace 3"
"Mod+Ctrl+4" = "column-move-to-workspace 4"
"Mod+Ctrl+5" = "column-move-to-workspace 5"
"Mod+Ctrl+6" = "column-move-to-workspace 6"
"Mod+Ctrl+7" = "column-move-to-workspace 7"
"Mod+Ctrl+8" = "column-move-to-workspace 8"
"Mod+Ctrl+9" = "column-move-to-workspace 9"

"Mod+Alt+BracketLeft" = "window-consume-or-expel-left"
"Mod+Alt+BracketRight" = "window-consume-or-expel-right"

"Mod+Shift+BracketRight" = "window-consume-from-right"
"Mod+Shift+BracketLeft" = "window-consume-or-expel-right"

"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "session-quit skip-confirmation"
"Mod+Ctrl+R" = "window-set-secondary-extent 1.0"
"Mod+Ctrl+F" = "window-toggle-maximize-to-edges"
"Mod+Alt+F" = "window-toggle-maximize"
"Mod+F" = "window-toggle-fullscreen"
"Mod+Shift+F" = "window-set-primary-extent 1.0"

"Mod+Ctrl+C" = "column-center"

"Mod+Alt+H" = "window-modify-primary-extent -0.06"
"Mod+Alt+L" = "window-modify-primary-extent +0.06"

"Mod+Alt+K" = "window-modify-secondary-extent -0.06"
"Mod+Alt+J" = "window-modify-secondary-extent +0.06"

"Mod+Space" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+H" = { action = "window-focus-switch-floating", repeat = false }
"Mod+G" = { action = "column-toggle-tabbed", repeat = false }

"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit skip-confirmation", repeat = false }
"Mod+Shift+P" = { action = "dpms-off", repeat = false }
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+BackSpace" = { action = "spawn noctalia msg panel-toggle session", repeat = false }

"Mod+MouseBack" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0", release = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 1", repeat = false }

# wlr-which-key menus
"Mod+m" = { action = "spawn wlr-which-key -k m umbriel", repeat = false }
"Mod+n" = { action = "spawn wlr-which-key -k n umbriel", repeat = false }
"Mod+a" = { action = "spawn wlr-which-key -k a umbriel", repeat = false }
"Mod+C" = { action = "spawn wlr-which-key -k c umbriel", repeat = false }
"Mod+s" = { action = "submap scratchpad", repeat = false }
# "Mod+alt+s" = { action = "spawn wlr-which-key -k f umbriel", repeat = false }

# Scratchpad submap
"Mod+Alt+S" = { action = "spawn wlr-which-key -k s umbriel", repeat = false }
"submap[scratchpad],M" = { action = "scratchpad-toggle music", submap = "reset" }
"submap[scratchpad],R" = { action = "scratchpad-toggle read", submap = "reset" }
"submap[scratchpad],G" = { action = "scratchpad-toggle gaming", submap = "reset" }
"submap[scratchpad],V" = { action = "scratchpad-toggle vms", submap = "reset" }
"submap[scratchpad],S" = { action = "scratchpad-toggle study", submap = "reset" }
"submap[scratchpad],Escape" = "submap reset"

# ==============================================================================
# Window rules
# ==============================================================================
# Dolphin popups blur against live content.
[[window_rule]]
match.app_id = '^org\.kde\.dolphin$'
blur = true
blur_popups = true

# Media viewers stay opaque and unblurred.
[[window_rule]]
match.app_id = '\.*org\.kde\.okular.*|.*mpv.*|.*vlc.*|.*org\.kde\.gwenview.*|^com\.obsproject\.Studio$'
opacity = 1.0
blur = false

[[window_rule]]
match.app_id = '.*zen.*'
match.title = '^(\([0-9]\))*.*YouTube.*'
opacity = 1.0
blur = false

[[window_rule]]
match.app_id = 'dev\.noctalia\.UmbrielSharePicker'
default_floating = true

# KDE portal dialogs float.
[[window_rule]]
match.app_id = 'org\.freedesktop\.impl\.portal\.desktop\.kde'
default_floating = true

# [[window_rule]]
# match.is_maximized_to_edges = true
# border_width = 0
# outer_border_width = 0

# [animation.windows_opacity]
# enabled = true
# curve = "spring:1,900"
#
# [[window_rule]]
# match.is_focused = false
# opacity = 0.85
# blur = true
#
# [[window_rule]]
# match.is_focused = true
# opacity = 0.90
# blur = true

# Workspace assignments.
[[window_rule]]
match.app_id = 'zen'
default_workspace = "Net"
default_maximize = true

[[window_rule]]
match.app_id = '.*[Vv]irt-manager.*|.*[Vv]irt-viewer.*|.*[Rr]emote-viewer.*|.*[Bb]oxes.*|.*[Vv]irtual[Bb]ox.*|.*[Vv]mware.*|.*[Vv]mplayer.*|.*[Qq][Ee][Mm][Uu].*'
allow_shortcuts_inhibit = false
opacity = 1.0
default_scratchpad = "vms"
default_focused = true
blur = true
blur_optimized = false

# [[window_rule]]
# match.app_id = '.*org\.kde\.okular.*'
# default_workspace = "Read"

[[window_rule]]
match.app_id = 'vesktop|org\.telegram\.desktop'
default_workspace = "Comm"
default_scrolling_extent = 1.0

# Floating windows: rounded corners, niri's fixed 800x800 default size.
[[window_rule]]
match.is_floating = true
corner_radius = 5
border_width = 1
default_floating_size_px = { width = 800, height = 800 }

# Picture-in-picture and utility dialogs.
[[window_rule]]
match.app_id = 'firefox$'
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = 'zen'
match.title = '[Ss]ave [Ii]mage'
default_floating = true
default_floating_size_px = { width = 900, height = 700 }

[[window_rule]]
match.app_id = 'xdg-desktop-portal-gtk'
default_floating = true
default_floating_size_px = { width = 900, height = 700 }

[[window_rule]]
match.title = 'Choose\sFiles'
default_floating = true
default_floating_size_px = { width = 900, height = 700 }

[[window_rule]]
match.app_id = ['dev.noctalia.Noctalia', 'org\.gnome\.Calculator']
default_floating = true
# default_floating_size_px = { width = 900, height = 700 }

[[window_rule]]
match.app_id = ['dev.noctalia.Noctalia']
dim_behind = 0.7

# Password managers are excluded from screenshots and recordings.
[[window_rule]]
match.app_id = ['^org\.keepassxc\.KeePassXC$', '^org\.gnome\.World\.Secrets$']
block_capture = true

# [[window_rule]]
# match.title = 'calibre\s+-\s+Preferences'
# default_floating = true
# default_floating_size_px = { width = 1100, height = 800 }

[[window_rule]]
match.app_id = '^foot-dropterm$|^kitty-dropterm$'
default_floating = true
default_position = { x = 0, y = 15, anchor = "bottom" }
default_floating_size = { width = 0.6, height = 0.5 }

[[window_rule]]
match.app_id = '^org\.kde\.ark$|hyprland-share-picker'
default_floating = true
default_floating_size_px = { width = 780, height = 500 }

[[window_rule]]
match.app_id = '^(mpv)$|^(snappergui)$|^(imv)$|^(org\.kde\.gwenview)$|^(org.gnome.Shotwell)$|org\.kde\.kdeconnect\.handler|org\.kde\.kdeconnect\.app|^(kvantummanager)$|^(qt6ct)$|^(qt5ct)$|^(org.gnome.ark)$|^(pavucontrol)$|^(pavucontrol-qt)$|^(org.gnome.FileRoller)$|^(com.gabm.satty)$|^(org\.kde\.partitionmanager)$|^(org\.qbittorrent\.qBittorrent)$'
default_floating = true
default_floating_size_px = { width = 1200, height = 800 }

# Private browsing and social media are excluded from screencasts.
[[window_rule]]
match.app_id = '(zen|^org\.kde\.dolphin|^mpv$)'
match.title = '(.*[wW]hats[aA]pp.*|.*[iI]nstagram.*|.*[Rr]eddit.*|.*[zZ]en\s*[bB]rowser\s*[pP]rivate\s*[Bb]rowsing.*|.*priv.*|.*\.p.*)'
block_capture = true

# Dolphin dialogs and main window.
[[window_rule]]
match.title = '^Deleting.*'
default_floating = true
default_floating_size = { width = 0.30, height = 0.20 }

[[window_rule]]
match.app_id = '^(org\.kde\.dolphin$|^heroic.*|.*org\.kde\.okular.*|dev\.noctalia\.luciole)'
default_maximize_to_edges = true

[[window_rule]]
match.app_id = '.*calibre-ebook-viewer.*|vlc'
match.title = '.*E-book viewer.*'
default_maximize = true

[[window_rule]]
match.app_id = '^org\.kde\.dolphin$'
match.title = '^[Cc]ompressing.*[Dd]olphin'
default_floating = true

[[window_rule]]
match.app_id = '^deadcells'
default_fullscreen = true

[[window_rule]]
match.app_id = 'com.github.niri-shot'
default_floating = true

# ==============================================================================
# Layer rules
# ==============================================================================
[[layer_rule]]
match.namespace = '^wlr_which_key$'
blur = true
blur_ignore_alpha = 0.9
blur_optimized = true

[[layer_rule]]
match.namespace = 'noctalia-desktop-widget-media_player.*'
blur = true
blur_optimized = true

[[layer_rule]]
match.namespace = "^noctalia-bar-.*"
blur = true
blur_ignore_alpha = 0.9
blur_popups = true

[[layer_rule]]
match.namespace = "(^noctalia-osd.*)|(noctalia-notification.*)"
blur = true
blur_ignore_alpha = 0.9
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-attached-panel.*"
blur = true
blur_ignore_alpha = 0.9
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-dock.*"
blur = true
blur_ignore_alpha = 0.9
blur_popups = true

[[layer_rule]]
match.namespace = "noctalia-desktop-widget-media_player.*"
blur = true
blur_ignore_alpha = 0.9
blur_popups = true

# ==============================================================================
# Workspaces
# Mirrors niri workspace "Comm" / "Read" / "Net" / "Vms".
# ==============================================================================
[[workspace]]
name = "web"

# [[workspace]]
# name = "general"

[[workspace]]
name = "dev"

# =================================================================================
# overview
# =================================================================================
[overview]
zoom = 0.4
background_blur = false

# =================================================================================
# scratchpads
# =================================================================================
[[scratchpad]]
name = "music"
layout.mode = "dwindle"
layout.struts = { left = 50, right = 50, top = 50, bottom = 50 }
hide_when_empty = true

[[window_rule]]
match.app_id = "^kopuz$"
default_scratchpad = "music"
default_focused = true
dim_behind = 1.0

[[scratchpad]]
name = "read"
layout.mode = "scrolling"
layout.gap = 0
layout.struts = { left = 5, right = 5, top = 5, bottom = 5 }
layout.scrolling.default_extent_fraction = 1.0
hide_when_empty = true

[[window_rule]]
match.app_id = '.*org\.kde\.okular.*|.*calibre.*|.*zathura.*|.*org\.gnome\.Evince.*|.*mupdf.*|.*[Ff]oliate.*'
default_scratchpad = "read"
default_maximize = true
default_focused = true

[[scratchpad]]
name = "study"
layout.mode = "scrolling"
layout.gap = 0
layout.struts = { left = 5, right = 5, top = 5, bottom = 5 }
layout.scrolling.default_extent_fraction = 1.0
hide_when_empty = true

[[window_rule]]
match.app_id = '.*org\.kde\.okular.*|.*zathura.*|.*org\.gnome\.Evince.*|.*org\.gnome\.Papers.*|.*mupdf.*|.*qpdfview.*|.*[Ss]ioyek.*|.*xpdf.*'
default_scratchpad = "study"
default_maximize = true
default_focused = true

[[scratchpad]]
name = "gaming"
layout.mode = "scrolling"
layout.scrolling.default_extent_fraction = 1.0
hide_when_empty = true

# Launchers, their dialogs, and launched games all go to the gaming scratchpad.
[[window_rule]]
match.app_id = '^steam$|^steamwebhelper$|.*[Hh]eroic.*|.*[Ll]utris.*|.*[Bb]ottles.*|.*[Ff]augus.*|.*[Ss]ober.*|.*[Pp]rism[Ll]auncher.*|.*[Mm]inecraft.*|.*osu.*|.*itgmania.*|^steam_app_.*$|.*\.[Ee][Xx][Ee]$'
default_scratchpad = "gaming"
default_focused = true

[[window_rule]]
match.content_type = "game"
default_scratchpad = "gaming"
default_focused = true

[[scratchpad]]
name = "vms"
layout.mode = "scrolling"
layout.scrolling.default_extent_fraction = 1.0
hide_when_empty = true

# =================================================================================
# =================================================================================
# =================================================================================
[include.optional]
files = [
  "~/.config/umbriel/noctalia.toml",
  "~/.config/umbriel/override.toml",
]
